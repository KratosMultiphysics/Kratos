<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Helvetica, Arial, sans-serif">
  <title>The surrogate lifecycle in five steps</title>
  <desc>Export, train, save, deploy, validate - with the Kratos, application and PhysicsNeMo pieces involved at each step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1100" height="430" fill="#ffffff"/>
  <g font-size="14">
    <!-- step boxes -->
    <rect x="20"  y="20" width="190" height="70" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.5"/>
    <rect x="240" y="20" width="190" height="70" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.5"/>
    <rect x="460" y="20" width="190" height="70" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.5"/>
    <rect x="680" y="20" width="190" height="70" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.5"/>
    <rect x="900" y="20" width="180" height="70" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.5"/>
    <text x="115" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d00">1. Export</text>
    <text x="115" y="70" text-anchor="middle" fill="#333">a real solve, sample_*.npz</text>
    <text x="335" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d00">2. Train</text>
    <text x="335" y="70" text-anchor="middle" fill="#333">those files, a torch model</text>
    <text x="555" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d00">3. Save</text>
    <text x="555" y="70" text-anchor="middle" fill="#333">checkpoint + model card</text>
    <text x="775" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d00">4. Deploy</text>
    <text x="775" y="70" text-anchor="middle" fill="#333">predictions in the loop</text>
    <text x="990" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d00">5. Validate</text>
    <text x="990" y="70" text-anchor="middle" fill="#333">numbers, error bars, guards</text>
    <line x1="210" y1="55" x2="238" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="430" y1="55" x2="458" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="55" x2="678" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="870" y1="55" x2="898" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <!-- lanes -->
  <g font-size="13" fill="#333">
    <rect x="20" y="110" width="1060" height="90" rx="8" fill="#eaf2fb" stroke="#1f4e79"/>
    <text x="32" y="130" font-size="14" font-weight="bold" fill="#1f4e79">Kratos</text>
    <text x="115" y="160" text-anchor="middle">solves, swept over</text>
    <text x="115" y="178" text-anchor="middle">the family of interest</text>
    <text x="335" y="168" text-anchor="middle" fill="#888">-</text>
    <text x="555" y="168" text-anchor="middle" fill="#888">-</text>
    <text x="775" y="160" text-anchor="middle">AnalysisStage running</text>
    <text x="775" y="178" text-anchor="middle">with the process attached</text>
    <text x="990" y="160" text-anchor="middle">reference fields from</text>
    <text x="990" y="178" text-anchor="middle">a solve to compare against</text>

    <rect x="20" y="210" width="1060" height="100" rx="8" fill="#f6f6f6" stroke="#666"/>
    <text x="32" y="230" font-size="14" font-weight="bold" fill="#333">this application</text>
    <text x="115" y="262" text-anchor="middle" font-family="monospace" font-size="12">processes.export.</text>
    <text x="115" y="280" text-anchor="middle" font-family="monospace" font-size="12">dataset_export_process</text>
    <text x="335" y="262" text-anchor="middle" font-family="monospace" font-size="12">training.torch_dataset</text>
    <text x="335" y="280" text-anchor="middle" font-family="monospace" font-size="12">training_utils.TrainModel</text>
    <text x="555" y="262" text-anchor="middle" font-family="monospace" font-size="12">SaveTrainedModel(card=...)</text>
    <text x="555" y="280" text-anchor="middle" font-family="monospace" font-size="12">deployment.model_registry</text>
    <text x="775" y="262" text-anchor="middle" font-family="monospace" font-size="12">processes.inference.</text>
    <text x="775" y="280" text-anchor="middle" font-family="monospace" font-size="12">inference_process</text>
    <text x="990" y="262" text-anchor="middle" font-family="monospace" font-size="11">validation_metrics_process</text>
    <text x="990" y="280" text-anchor="middle" font-family="monospace" font-size="11">"uncertainty", "ood_guard" blocks</text>

    <rect x="20" y="320" width="1060" height="90" rx="8" fill="#eef7ee" stroke="#2e6b2e"/>
    <text x="32" y="340" font-size="14" font-weight="bold" fill="#2e6b2e">PhysicsNeMo</text>
    <text x="115" y="370" text-anchor="middle">datapipes</text>
    <text x="115" y="388" text-anchor="middle">(readers, transforms)</text>
    <text x="335" y="370" text-anchor="middle">models, optim, sym</text>
    <text x="335" y="388" text-anchor="middle">(architectures, PDE losses)</text>
    <text x="555" y="370" text-anchor="middle">Module, .mdlus</text>
    <text x="555" y="388" text-anchor="middle">(self-describing checkpoint)</text>
    <text x="775" y="370" text-anchor="middle">the model's forward</text>
    <text x="775" y="388" text-anchor="middle">(torch, ONNX Runtime, Triton)</text>
    <text x="990" y="370" text-anchor="middle">metrics, guardrails, uq</text>
    <text x="990" y="388" text-anchor="middle">(CRPS, OODGuard, GP heads)</text>
  </g>
</svg>
