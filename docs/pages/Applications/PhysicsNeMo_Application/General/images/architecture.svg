<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Helvetica, Arial, sans-serif">
  <title>PhysicsNeMoApplication architecture</title>
  <desc>Kratos Multiphysics on the left, NVIDIA PhysicsNeMo on the right, and the application's packages in between: processes attach to the solution loop, bridges convert data both ways, and training, physics, deployment, distributed and active-learning packages sit on top. Artifacts flow along the bottom.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="150" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">Kratos Multiphysics</text>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">PhysicsNeMoApplication</text>
  <text x="950" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6b2e">NVIDIA PhysicsNeMo</text>

  <!-- Kratos column -->
  <rect x="30" y="55" width="240" height="470" rx="10" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.5"/>
  <rect x="45" y="70" width="210" height="70" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="150" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">AnalysisStage</text>
  <text x="150" y="118" text-anchor="middle" font-size="13" fill="#333">solution loop, ProcessInfo</text>
  <rect x="45" y="155" width="210" height="110" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="150" y="181" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">ModelPart</text>
  <text x="150" y="203" text-anchor="middle" font-size="13" fill="#333">nodes, elements, conditions</text>
  <text x="150" y="222" text-anchor="middle" font-size="13" fill="#333">sub-model-parts, Variables</text>
  <text x="150" y="244" text-anchor="middle" font-size="13" fill="#333">historical and non-historical data</text>
  <rect x="45" y="280" width="210" height="70" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="150" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">TensorAdaptors</text>
  <text x="150" y="328" text-anchor="middle" font-size="13" fill="#333">zero-copy numpy views</text>
  <rect x="45" y="365" width="210" height="70" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="150" y="391" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">Solvers and builders</text>
  <text x="150" y="413" text-anchor="middle" font-size="13" fill="#333">residuals, tangents, adjoints</text>
  <rect x="45" y="450" width="210" height="60" rx="6" fill="#ffffff" stroke="#1f4e79"/>
  <text x="150" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">DataCommunicator</text>
  <text x="150" y="494" text-anchor="middle" font-size="13" fill="#333">MPI ranks, ghost nodes</text>

  <!-- Application column -->
  <rect x="320" y="55" width="460" height="470" rx="10" fill="#f6f6f6" stroke="#666" stroke-width="1.5"/>
  <rect x="335" y="70" width="430" height="88" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="550" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">processes/  (attached to the solve, the only Factories)</text>
  <text x="550" y="116" text-anchor="middle" font-size="13" fill="#333">export/ writes training data;  inference/ runs a model in the loop;</text>
  <text x="550" y="138" text-anchor="middle" font-size="13" fill="#333">validation metrics, adaptive remesh, adjoint sensitivity</text>

  <rect x="335" y="173" width="430" height="88" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="550" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">bridges/  (stateless, Kratos data to PhysicsNeMo data and back)</text>
  <text x="550" y="219" text-anchor="middle" font-size="13" fill="#333">torch, mesh (tessellation + provenance), graph, grid, particle</text>
  <text x="550" y="241" text-anchor="middle" font-size="13" fill="#333">mapping, calculus, rom, adjoint, cfd, curator, vfgn</text>

  <rect x="335" y="276" width="205" height="70" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="437" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">training/</text>
  <text x="437" y="322" text-anchor="middle" font-size="13" fill="#333">loops, datasets, schemes</text>
  <rect x="560" y="276" width="205" height="70" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="662" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">physics/</text>
  <text x="662" y="322" text-anchor="middle" font-size="13" fill="#333">residuals, PINNs, sensitivities</text>

  <rect x="335" y="361" width="205" height="70" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="437" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">deployment/</text>
  <text x="437" y="407" text-anchor="middle" font-size="13" fill="#333">checkpoints, cards, ONNX, Triton, UQ</text>
  <rect x="560" y="361" width="205" height="70" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="662" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">distributed/</text>
  <text x="662" y="407" text-anchor="middle" font-size="13" fill="#333">ranks, halos, ShardTensor</text>

  <rect x="335" y="446" width="430" height="64" rx="6" fill="#ffffff" stroke="#666"/>
  <text x="550" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">active_learning/  and  utilities/</text>
  <text x="550" y="492" text-anchor="middle" font-size="13" fill="#333">Kratos as the labeling oracle; shared gather/scatter, CuPy, NVTX</text>

  <!-- PhysicsNeMo column -->
  <rect x="830" y="55" width="240" height="470" rx="10" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.5"/>
  <g font-size="13" fill="#333">
    <rect x="845" y="70" width="210" height="52" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">models</text>
    <text x="950" y="111" text-anchor="middle" font-size="12">FNO, MeshGraphNet, Transolver, DoMINO</text>
    <rect x="845" y="132" width="210" height="52" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">mesh</text>
    <text x="950" y="173" text-anchor="middle">Mesh, DomainMesh, calculus, generate</text>
    <rect x="845" y="194" width="210" height="52" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">datapipes</text>
    <text x="950" y="235" text-anchor="middle">readers, transforms, CAE pipelines</text>
    <rect x="845" y="256" width="210" height="52" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">sym</text>
    <text x="950" y="297" text-anchor="middle">PDE, PhysicsInformer</text>
    <rect x="845" y="318" width="210" height="52" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">diffusion</text>
    <text x="950" y="359" text-anchor="middle">preconditioners, samplers, losses</text>
    <rect x="845" y="380" width="210" height="52" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">distributed, domain_parallel</text>
    <text x="950" y="421" text-anchor="middle">DistributedManager, ShardTensor</text>
    <rect x="845" y="442" width="210" height="68" rx="6" fill="#ffffff" stroke="#2e6b2e"/>
    <text x="950" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">Module, active_learning,</text>
    <text x="950" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">metrics, deploy, experimental</text>
    <text x="950" y="502" text-anchor="middle" font-size="12">checkpoints, Driver, guardrails, LoRA</text>
  </g>

  <!-- Horizontal arrows -->
  <line x1="270" y1="112" x2="335" y2="112" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="302" y="102" text-anchor="middle" font-size="11" fill="#555">hooks</text>
  <line x1="270" y1="217" x2="335" y2="217" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="302" y="207" text-anchor="middle" font-size="11" fill="#555">fields</text>
  <line x1="270" y1="315" x2="335" y2="315" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="400" x2="335" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="270" y1="480" x2="335" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="780" y1="217" x2="845" y2="217" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="812" y="207" text-anchor="middle" font-size="11" fill="#555">tensors</text>
  <line x1="780" y1="315" x2="845" y2="315" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="780" y1="400" x2="845" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="780" y1="480" x2="845" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Artifacts row -->
  <rect x="30" y="560" width="1040" height="110" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="550" y="586" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">Artifacts that travel between the steps</text>
  <g font-size="13" fill="#333">
    <rect x="50" y="600" width="230" height="52" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="165" y="622" text-anchor="middle" font-weight="bold">training data</text>
    <text x="165" y="641" text-anchor="middle">.npz, .pmsh, Zarr, VTU, .usda</text>
    <rect x="300" y="600" width="230" height="52" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="415" y="622" text-anchor="middle" font-weight="bold">checkpoints</text>
    <text x="415" y="641" text-anchor="middle">.mdlus or TorchScript .pt + .card.json</text>
    <rect x="550" y="600" width="230" height="52" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="665" y="622" text-anchor="middle" font-weight="bold">served models</text>
    <text x="665" y="641" text-anchor="middle">.onnx, Triton repository, NIM</text>
    <rect x="800" y="600" width="250" height="52" rx="6" fill="#ffffff" stroke="#999"/>
    <text x="925" y="622" text-anchor="middle" font-weight="bold">sidecars</text>
    <text x="925" y="641" text-anchor="middle">OOD guard, GP head, validation .json</text>
  </g>
  <line x1="437" y1="510" x2="205" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="437" y1="510" x2="420" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="662" y1="510" x2="665" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="662" y1="510" x2="905" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
</svg>
