<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif">
  <title>The three replaceable parts of a diffusion model, and the CorrDiff two-stage recipe</title>
  <desc>Top: denoiser, preconditioner and sampler as separate boxes with what each answers. Bottom: CorrDiff - a regression model predicts the conditional mean, a residual diffusion model learns what is left, and an ensemble of samples gives mean and spread.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6b2e">physicsnemo.diffusion splits the problem into three parts you can swap independently</text>
  <g font-size="13" fill="#333">
    <rect x="20" y="50" width="340" height="150" rx="10" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="190" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">Denoiser (the network)</text>
    <text x="190" y="97" text-anchor="middle">What removes the noise?</text>
    <text x="190" y="120" text-anchor="middle" font-size="11.5">SongUNet, SongUNetPosEmbd, DhariwalUNet (2-D images)</text>
    <text x="190" y="138" text-anchor="middle">DiT (tokens), DiffusionUNet3D (volumes, experimental)</text>
    <text x="190" y="160" text-anchor="middle" fill="#666">anything implementing the DiffusionModel protocol;</text>
    <text x="190" y="176" text-anchor="middle" fill="#666">this bridge wraps DiT and UNet3D via denoiser_interface</text>
    <rect x="380" y="50" width="340" height="150" rx="10" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="550" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">Preconditioner + noise schedule</text>
    <text x="550" y="97" text-anchor="middle">How is noise scaled, how is the net told the level?</text>
    <text x="550" y="120" text-anchor="middle">EDMPrecond, VEPrecond, VPPrecond, iDDPMPrecond</text>
    <text x="550" y="138" text-anchor="middle" font-size="11.5">EDMPrecondSuperResolution (conditioned on a coarse field)</text>
    <text x="550" y="160" text-anchor="middle" fill="#666">EDM: sigma_data sets the scale the fields must live at -</text>
    <text x="550" y="176" text-anchor="middle" fill="#666">feed raw 1e-3 fields and the noise wins</text>
    <rect x="740" y="50" width="340" height="150" rx="10" fill="#eef7ee" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="910" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6b2e">Sampler / solver</text>
    <text x="910" y="97" text-anchor="middle">How do we walk from noise to a sample?</text>
    <text x="910" y="120" text-anchor="middle">deterministic Heun (EDM), stochastic Euler/Heun,</text>
    <text x="910" y="138" text-anchor="middle">plus guidance (DPS) and multi-diffusion patching</text>
    <text x="910" y="160" text-anchor="middle" fill="#666">run it M times: the spread of the M samples is a</text>
    <text x="910" y="176" text-anchor="middle" fill="#666">calibrated statement of what the data does not fix</text>
  </g>
  <!-- CorrDiff -->
  <text x="550" y="240" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a4d00">CorrDiff: predict the mean deterministically, let diffusion learn only the remainder</text>
  <g font-size="12.5" fill="#333">
    <rect x="20" y="265" width="150" height="80" rx="8" fill="#eaf2fb" stroke="#1f4e79"/>
    <text x="95" y="290" text-anchor="middle" font-weight="bold" fill="#1f4e79">condition</text>
    <text x="95" y="310" text-anchor="middle">coarse grid, mask +</text>
    <text x="95" y="326" text-anchor="middle">sensors, constraints</text>
    <rect x="215" y="265" width="190" height="80" rx="8" fill="#fff4e0" stroke="#c27c0e"/>
    <text x="310" y="290" text-anchor="middle" font-weight="bold" fill="#7a4d00">stage 1: regression</text>
    <text x="310" y="310" text-anchor="middle">CorrDiffRegressionUNet</text>
    <text x="310" y="326" text-anchor="middle">predicts the conditional mean</text>
    <rect x="450" y="265" width="210" height="80" rx="8" fill="#fff4e0" stroke="#c27c0e"/>
    <text x="555" y="290" text-anchor="middle" font-weight="bold" fill="#7a4d00">stage 2: residual diffusion</text>
    <text x="555" y="310" text-anchor="middle">SongUNetPosEmbd on target - mean</text>
    <text x="555" y="326" text-anchor="middle">trained with ResidualLoss</text>
    <rect x="705" y="265" width="170" height="80" rx="8" fill="#eef7ee" stroke="#2e6b2e"/>
    <text x="790" y="290" text-anchor="middle" font-weight="bold" fill="#2e6b2e">M samples</text>
    <text x="790" y="310" text-anchor="middle">mean + residual_k,</text>
    <text x="790" y="326" text-anchor="middle">k = 1 .. M</text>
    <rect x="920" y="265" width="160" height="80" rx="8" fill="#eaf2fb" stroke="#1f4e79"/>
    <text x="1000" y="290" text-anchor="middle" font-weight="bold" fill="#1f4e79">written to Kratos</text>
    <text x="1000" y="310" text-anchor="middle">mean to output_fields,</text>
    <text x="1000" y="326" text-anchor="middle">std to uncertainty_fields</text>
    <g stroke="#555" stroke-width="1.8">
      <line x1="170" y1="305" x2="213" y2="305" marker-end="url(#arrow)"/>
      <line x1="405" y1="305" x2="448" y2="305" marker-end="url(#arrow)"/>
      <line x1="660" y1="305" x2="703" y2="305" marker-end="url(#arrow)"/>
      <line x1="875" y1="305" x2="918" y2="305" marker-end="url(#arrow)"/>
    </g>
    <text x="550" y="380" text-anchor="middle" fill="#444">Why the split: a deterministic net learns a mean far more easily than a diffusion model does, so the residual stage only has to learn structure the mean misses.</text>
    <text x="550" y="398" text-anchor="middle" fill="#444">Two upstream traps: the residual denoiser needs img_in_channels = condition channels + the 4 positional-embedding channels,</text>
    <text x="550" y="414" text-anchor="middle" fill="#444">and ResidualLoss does not freeze the regression net - freeze it yourself.</text>
  </g>
  <g font-size="12.5" fill="#333">
    <rect x="20" y="425" width="1060" height="80" rx="8" fill="#f6f6f6" stroke="#666"/>
    <text x="32" y="447" font-weight="bold">In this application</text>
    <text x="32" y="467" font-family="monospace" font-size="11.5">training.diffusion_utils: TrainDiffusionModel (losses edm_sr / regression / residual), TrainCorrDiffPair, WrapDenoiser("dit" | "unet3d")</text>
    <text x="32" y="487" font-family="monospace" font-size="11.5">processes.inference.diffusion_inference_process: sampler_settings, "regression_settings" adds the mean, ensemble mean + std written back</text>
  </g>
</svg>
