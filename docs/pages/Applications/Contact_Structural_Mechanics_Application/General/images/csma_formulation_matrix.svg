<text x="30" y="860" class="note">Facts: mortar_type is read by auxiliary_methods_solvers.py (AuxiliaryAddVariables / AuxiliaryAddDofs / AuxiliaryCreateLinearSolver) and by contact_convergence_criteria_factory.py (GetMortarCriteria).</text>
<text x="30" y="880" class="note">MixedULMLinearSolver is inserted only for &quot;ALMContactFrictional*&quot; and &quot;ALMContactFrictionlessComponents&quot; when use_mixed_ulm_solver = true. Axisym conditions exist only for 2D2N ALM/penalty families (never for Components).</text>
<text x="30" y="900" class="note">NV = normal_variation &quot;nodal_elemental_derivatives&quot; (TNormalVariation = true). Frictional mortar_type values force buffer_size ≥ 3 (AuxiliarySetSettings). PureSlip suffix sets pure_slip in the mortar criterion.</text>
<text x="30" y="932" class="foot">ContactStructuralMechanicsApplication · Kratos Multiphysics</text>
