<text x="30" y="44" class="title">Test suite map</text>
<text x="30" y="72" class="sub">tests/test_ContactStructuralMechanicsApplication.py (Python, 122 active tests + 5 commented out) and tests/cpp_tests (91 gtest cases in KratosContactStructuralMechanicsFastSuite)</text>
<rect x="30" y="100" width="900" height="660" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="46" y="128" class="h" fill="#7c3aed" text-anchor="start">validation  (-l validation)  ⊃ nightly  —  +37 tests (validation-only) · long runs</text>
<rect x="46" y="140" width="868" height="470" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="62" y="168" class="h" fill="#0d9488" text-anchor="start">nightly  (-l nightly)  ⊃ small  —  +46 tests (nightly-only)</text>
<rect x="62" y="180" width="836" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="78" y="208" class="h" fill="#2563eb" text-anchor="start">small  (-l small, default)  —  39 tests, seconds each</text>
<text x="78" y="236" class="b" text-anchor="start">• TestProcessFactory (2) · TestCheckNormals (2) · mesh tying patch tests 2D/3D (3)</text>
<text x="78" y="262" class="b" text-anchor="start">• ALM frictionless hyper-simple patch tests: block / elimination / with constraints / slope / triangles</text>
<text x="78" y="284" class="b" text-anchor="start">/ 3D (6) + Components (5)</text>
<text x="78" y="310" class="b" text-anchor="start">• ALM frictional patch tests: no friction, perfect stick, threshold slip, slip, stick (5) + Components</text>
<text x="78" y="332" class="b" text-anchor="start">(5)</text>
<text x="78" y="358" class="b" text-anchor="start">• penalty frictionless (2) · penalty frictional stick / slip / threshold / no-friction / perfect-stick</text>
<text x="78" y="380" class="b" text-anchor="start">(5)</text>
<text x="78" y="406" class="b" text-anchor="start">• MPC contact patch tests 2D/3D, with friction, slope, matching / not matching (7)</text>
<text x="62" y="458" class="b" text-anchor="start">• ALM patch tests: complex geometry, slope, not matching A/B, 3D tri↔quad mixed (8) + Components (8)</text>
<text x="62" y="482" class="b" text-anchor="start">• TestCheckNormals s-shape · moving-mesh integration · mortar mapper less-basic / curvature (4) · Taylor</text>
<text x="62" y="504" class="b" text-anchor="start">patch · Hertz simple sphere · beams (3) + Components (3)</text>
<text x="62" y="528" class="b" text-anchor="start">• adaptive remeshing patch test (needs MeshingApplication) · mesh tying tri↔quad + simple patch (3)</text>
<text x="62" y="552" class="b" text-anchor="start">• ALM frictional: pure friction, basic friction, static evolution load (3) · MPC beams: axil / contact /</text>
<text x="62" y="574" class="b" text-anchor="start">tying / friction (4)</text>
<text x="46" y="636" class="b" text-anchor="start">• double-curvature exact integration (2) · dynamic search tri/quad (2) · mortar mapping tri/quad (2) · mesh</text>
<text x="46" y="658" class="b" text-anchor="start">tying validation + large-displacement hexa (2)</text>
<text x="46" y="682" class="b" text-anchor="start">• ALM: Taylor dynamic / frictional · Hertz simple / complete / frictional · large displacement tetra / hexa ·</text>
<text x="46" y="704" class="b" text-anchor="start">mesh moving (matching, not matching, frictional pure slip) · self contact · multi-layer · frictional block ·</text>
<text x="46" y="726" class="b" text-anchor="start">evolution load · explicit penalty 3D · MPC: beams axil (tetra), plate</text>
<rect x="30" y="780" width="900" height="82" rx="10" fill="#f8fafc" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
<text x="46" y="804" class="b" fill="#6b7280" text-anchor="start">commented out in the validation suite (not run):</text>
<text x="46" y="826" class="s" text-anchor="start">TALMHertzSphereTestContact, TComponentsALMHertzSphereTestContact (axisymmetric memory FIXME) · TALMIroningTestContact,</text>
<text x="46" y="844" class="s" text-anchor="start">TALMIroningDieTestContact · TMultiLayerContactTest</text>
<rect x="30" y="880" width="900" height="175" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="46" y="906" class="h" fill="#d97706" text-anchor="start">ContactStructuralMechanicsTestFactory (contact_structural_mechanics_test_factory.py)</text>
<text x="46" y="930" class="b" text-anchor="start">each test = a class with file_name → &lt;file_name&gt;_parameters.json + _materials.json + .mdpa in the data folders;</text>
<text x="46" y="952" class="b" text-anchor="start">results checked by from_json_check_result_process against &lt;file_name&gt;_results.json</text>
<text x="46" y="976" class="b" text-anchor="start">frictionless_by_components = True → mortar_type ALMContactFrictionlessComponents + VECTOR_LAGRANGE_MULTIPLIER</text>
<text x="46" y="998" class="b" text-anchor="start">(Components* classes) · SmallTests.py 32 classes · NightlyTests.py 55 · ValidationTests.py 25</text>
<text x="46" y="1022" class="s" text-anchor="start">data folders: ALM_frictionless_contact_test_2D / _3D, ALM_frictional_contact_test_2D / _3D,</text>
<text x="46" y="1040" class="s" text-anchor="start">penalty_frictionless_contact_test_2D / _3D, penalty_frictional_contact_test_2D, mpc_contact_tests, mesh_tying_test</text>
